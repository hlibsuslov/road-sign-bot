name: deploy-notify
# Part A: build/deploy result → Telegram, entirely from GitHub Actions.
# Fires after the `deploy` workflow (self-hosted) finishes; runs GitHub-hosted so
# the Telegram token lives ONLY in GitHub Secrets and never touches our server.
# Least privilege: no repo write, no PAT. Secrets are set by the owner in the UI
# (Settings → Secrets and variables → Actions): DEPLOY_TG_TOKEN, DEPLOY_TG_CHAT_ID.
on:
  workflow_run:
    workflows: ["deploy"]
    types: [completed]

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify Telegram
        env:
          TG_TOKEN: ${{ secrets.DEPLOY_TG_TOKEN }}
          TG_CHAT: ${{ secrets.DEPLOY_TG_CHAT_ID }}
          ST: ${{ github.event.workflow_run.conclusion }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "Telegram secrets not set; skipping notification."
            exit 0
          fi
          IC=$([ "$ST" = "success" ] && echo "✅" || echo "❌")
          curl -sS --fail-with-body "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            -d disable_web_page_preview=true \
            --data-urlencode text="${IC} ${REPO}
          deploy → ${ST}
          ${SHA:0:12} · ${BRANCH}
          ${RUN_URL}"
