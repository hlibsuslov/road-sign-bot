name: deploy-notify
# Part A: build/deploy result → Telegram, entirely from GitHub Actions.
# Fires after the `deploy` workflow finishes; runs on this repository's isolated
# self-hosted runner, so notifications do not consume GitHub-hosted minutes.
# Least privilege: no repo write, no PAT. Secrets are set by the owner in the UI
# (Settings → Secrets and variables → Actions): DEPLOY_TG_TOKEN, DEPLOY_TG_CHAT_ID.
on:
  workflow_run:
    workflows: ["deploy"]
    types: [completed]

jobs:
  notify:
    runs-on: [self-hosted, linux, x64, deploy, road-sign-bot]
    permissions: {}
    steps:
      - name: Notify Telegram
        env:
          TG_TOKEN: ${{ secrets.DEPLOY_TG_TOKEN }}
          TG_CHAT: ${{ secrets.DEPLOY_TG_CHAT_ID }}
          ST: ${{ github.event.workflow_run.conclusion }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "Telegram secrets not set; skipping notification."
            exit 0
          fi
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          status = os.environ["ST"]
          icon = "✅" if status == "success" else "❌"
          text = (
              f"{icon} {os.environ['REPO']}\n"
              f"deploy → {status}\n"
              f"{os.environ['SHA'][:12]} · {os.environ['BRANCH']}\n"
              f"{os.environ['RUN_URL']}"
          )
          payload = urllib.parse.urlencode({
              "chat_id": os.environ["TG_CHAT"],
              "disable_web_page_preview": "true",
              "text": text,
          }).encode()
          url = f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/sendMessage"
          try:
              with urllib.request.urlopen(url, data=payload, timeout=20) as response:
                  if response.status != 200:
                      raise SystemExit(f"Telegram API returned HTTP {response.status}")
          except urllib.error.HTTPError as error:
              detail = error.read().decode("utf-8", "replace")
              raise SystemExit(f"Telegram API returned HTTP {error.code}: {detail}")
          except urllib.error.URLError as error:
              raise SystemExit(f"Telegram request failed: {error.reason}")
          PY
