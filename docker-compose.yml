services:
  road-sign-bot:
    build: .
    container_name: road-sign-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - bot-db:/app/db
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    labels:
      - "autoheal=true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-db:
